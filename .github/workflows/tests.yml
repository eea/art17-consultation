name: Tests

on:
  push:
    branches: [master, production]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # read from the environment by the change password view
      EEA_PASSWORD_RESET: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install requirements
        run: |
          pip install setuptools==84.2.1
          pip install -r requirements-dev.txt

      - name: Run tests
        run: >
          python -m pytest testsuite
          --cov=art17 --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: success() || failure()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
